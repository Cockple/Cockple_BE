server:
  port: 8080
  address: 0.0.0.0
  forward-headers-strategy: native
  tomcat:
    mbeanregistry:
      # Micrometer가 tomcat_threads_* 지표를 읽으려면 Tomcat MBean 등록이 필요(기본 off).
      enabled: true

spring:
  application:
    name: cockple.demo
  profiles:
    active: local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${DB_PASSWORD}
    hikari:
      keepalive-time: 60000
      max-lifetime: 1800000
      idle-timeout: 600000
      minimum-idle: 5
      maximum-pool-size: 10

  sql:
    init:
      mode: never

  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    baseline-version: 2026.03.23.00.00
    baseline-on-migrate: true
    out-of-order: false

  jpa:
    show_sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
        use_sql_comments: false
        default_batch_fetch_size: 1000

  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

  data:
    redis:
      port: 6379
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  cache:
    type: redis

gcs:
  bucket: ${GCS_BUCKET}

cockple:
  web:
    # WS도 이 목록 공유. cockple-fe.vercel.app/(끝슬래시)는 WS 기존값 유지용(무해).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://cockple.site,https://www.cockple.site,https://staging.cockple.site,https://cockple-fe.vercel.app,https://cockple-fe.vercel.app/}
    # 비우면 host-only 쿠키. 실제 운영/스테이징 값은 GitHub Variables의 COOKIE_DOMAIN이 주입한다.
    cookie-domain: ${COOKIE_DOMAIN:}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}
  token-uri: https://kauth.kakao.com/oauth/token
  user-info-uri: https://kapi.kakao.com/v2/user/me
  redirect-uri: ${KAKAO_REDIRECT_URI}
  admin-key: ${KAKAO_ADMIN_KEY}
  unlink-uri: https://kapi.kakao.com/v1/user/unlink

jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-validity: 900000
  refresh-token-validity: 1209600000
  refresh-token-reuse-grace: 30000

async:
  # 실시간 채팅 풀 (저지연 내부 I/O)
  chat:
    core-size: 8
    max-size: 16
    queue-capacity: 500
    await-termination-seconds: 30
  # 외부 도메인 이벤트 -> 알림 DB 저장 풀
  notification:
    ingress:
      core-size: 2
      max-size: 4
      queue-capacity: 500
      await-termination-seconds: 30
    # FCM 알림 발송 풀
    push:
      core-size: 2
      max-size: 8
      queue-capacity: 500
      await-termination-seconds: 30

fcm:
  fake-latency-ms: 0

# 관측성(Observability) — OTLP로 메트릭 push
# 기본 off, staging(및 추후 prod)에서 env로만 켠다.
management:
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_ENABLED:false}
        url: ${OTEL_URL:http://localhost:4318}/v1/metrics
        step: ${OTLP_STEP:1m}
        headers:
          Authorization: ${OTEL_AUTH:}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment: ${SPRING_PROFILES_ACTIVE:local}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health                             # 웹 노출 최소화 (메트릭은 OTLP push라 endpoint 불필요)

logging:
  level:
    org.hibernate.SQL: WARN


