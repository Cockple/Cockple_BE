name: COCKPLE_CD
on:
  push:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set environment variables by branch
        id: vars
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "DOCKER_TAG=latest" >> $GITHUB_OUTPUT
          else
            echo "DOCKER_TAG=staging" >> $GITHUB_OUTPUT
          fi
          

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker BUILD_PUSH
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_REPO }}:${{ steps.vars.outputs.DOCKER_TAG }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Copy files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.KEY }}
          source: "docker-compose.yml,init-db.sql,nginx/,scripts/"
          target: /home/ubuntu/cockple

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.KEY }}
          envs: >-
            DB_PASSWORD,GCS_BUCKET,GCS_BACKUP_BUCKET,
            KAKAO_CLIENT_ID,KAKAO_CLIENT_SECRET,KAKAO_REDIRECT_URI_PROD,KAKAO_REDIRECT_URI_STAGING,KAKAO_ADMIN_KEY,
            JWT_SECRET_KEY,FIREBASE_SERVICE_ACCOUNT_KEY,FCM_FAKE_LATENCY_MS,
            OTLP_METRICS_ENABLED,OTEL_URL,OTEL_AUTH,OTLP_STEP,
            CORS_ALLOWED_ORIGINS_PROD,CORS_ALLOWED_ORIGINS_STAGING,COOKIE_DOMAIN,NGINX_PROD_SERVER_NAME,NGINX_STAGING_SERVER_NAME,
            ASYNC_CHAT_CORE_SIZE,ASYNC_CHAT_MAX_SIZE,ASYNC_CHAT_QUEUE_CAPACITY,
            ASYNC_NOTIFICATION_CORE_SIZE,ASYNC_NOTIFICATION_MAX_SIZE,ASYNC_NOTIFICATION_QUEUE_CAPACITY
          script: |
            chmod +x /home/ubuntu/cockple/scripts/deploy.sh
            bash /home/ubuntu/cockple/scripts/deploy.sh \
              ${{ secrets.DOCKER_REPO }} \
              ${{ github.ref_name }}
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          GCS_BACKUP_BUCKET: ${{ secrets.GCS_BACKUP_BUCKET }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REDIRECT_URI_PROD: ${{ secrets.KAKAO_REDIRECT_URI_PROD }}
          KAKAO_REDIRECT_URI_STAGING: ${{ secrets.KAKAO_REDIRECT_URI_STAGING }}
          KAKAO_ADMIN_KEY: ${{ secrets.KAKAO_ADMIN_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FCM_FAKE_LATENCY_MS: ${{ vars.FCM_FAKE_LATENCY_MS }}
          # 관측성(OTLP) — URL/토글/step은 Variable, 인증 토큰은 Secret
          OTLP_METRICS_ENABLED: ${{ vars.OTLP_METRICS_ENABLED }}
          OTEL_URL: ${{ vars.OTEL_URL }}
          OTEL_AUTH: ${{ secrets.OTEL_AUTH }}
          OTLP_STEP: ${{ vars.OTLP_STEP }}
          ASYNC_CHAT_CORE_SIZE: ${{ vars.ASYNC_CHAT_CORE_SIZE }}
          ASYNC_CHAT_MAX_SIZE: ${{ vars.ASYNC_CHAT_MAX_SIZE }}
          ASYNC_CHAT_QUEUE_CAPACITY: ${{ vars.ASYNC_CHAT_QUEUE_CAPACITY }}
          ASYNC_NOTIFICATION_CORE_SIZE: ${{ vars.ASYNC_NOTIFICATION_CORE_SIZE }}
          ASYNC_NOTIFICATION_MAX_SIZE: ${{ vars.ASYNC_NOTIFICATION_MAX_SIZE }}
          ASYNC_NOTIFICATION_QUEUE_CAPACITY: ${{ vars.ASYNC_NOTIFICATION_QUEUE_CAPACITY }}
          # 미설정 시 빈 값 → docker-compose 기본값(현재 도메인) 사용(no-op).
          CORS_ALLOWED_ORIGINS_PROD: ${{ vars.CORS_ALLOWED_ORIGINS_PROD }}
          CORS_ALLOWED_ORIGINS_STAGING: ${{ vars.CORS_ALLOWED_ORIGINS_STAGING }}
          COOKIE_DOMAIN: ${{ vars.COOKIE_DOMAIN }}
          NGINX_PROD_SERVER_NAME: ${{ vars.NGINX_PROD_SERVER_NAME }}
          NGINX_STAGING_SERVER_NAME: ${{ vars.NGINX_STAGING_SERVER_NAME }}
