name: cockple

services:
  mysql:
    image: mysql:8.0
    container_name: cockple-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=512M
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    memswap_limit: 1536m

  redis:
    image: redis:7-alpine
    container_name: cockple-redis
    restart: always
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 200mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 256m
    memswap_limit: 384m

  cockple-app:
    container_name: cockple-app
    image: kanghana1/cockple:latest
    restart: always
    environment:
      JAVA_TOOL_OPTIONS: "-Xms768m -Xmx768m"
      SPRING_PROFILES_ACTIVE: prod
      LOG_PATH: /logs
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS_PROD:-http://localhost:5173,https://cockple.site,https://www.cockple.site,https://staging.cockple.site,https://cockple-fe.vercel.app,https://cockple-fe.vercel.app/}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # 스레드풀 튜닝(운영) 미설정 시 앱 기본값(chat 8/16/500, noti-ingress 2/4/500, noti-push 2/8/500)
      ASYNC_CHAT_CORE_SIZE: ${ASYNC_CHAT_CORE_SIZE:-8}
      ASYNC_CHAT_MAX_SIZE: ${ASYNC_CHAT_MAX_SIZE:-16}
      ASYNC_CHAT_QUEUE_CAPACITY: ${ASYNC_CHAT_QUEUE_CAPACITY:-500}
      # 알림 DB 저장(ingress) 풀
      ASYNC_NOTIFICATION_INGRESS_CORE_SIZE: ${ASYNC_NOTIFICATION_INGRESS_CORE_SIZE:-2}
      ASYNC_NOTIFICATION_INGRESS_MAX_SIZE: ${ASYNC_NOTIFICATION_INGRESS_MAX_SIZE:-4}
      ASYNC_NOTIFICATION_INGRESS_QUEUE_CAPACITY: ${ASYNC_NOTIFICATION_INGRESS_QUEUE_CAPACITY:-500}
      # FCM 발송(push) 풀
      ASYNC_NOTIFICATION_PUSH_CORE_SIZE: ${ASYNC_NOTIFICATION_PUSH_CORE_SIZE:-2}
      ASYNC_NOTIFICATION_PUSH_MAX_SIZE: ${ASYNC_NOTIFICATION_PUSH_MAX_SIZE:-8}
      ASYNC_NOTIFICATION_PUSH_QUEUE_CAPACITY: ${ASYNC_NOTIFICATION_PUSH_QUEUE_CAPACITY:-500}
      DB_PASSWORD: ${DB_PASSWORD}
      GCS_BUCKET: ${GCS_BUCKET}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI_PROD}
      KAKAO_ADMIN_KEY: ${KAKAO_ADMIN_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      FIREBASE_SERVICE_ACCOUNT_KEY: ${FIREBASE_SERVICE_ACCOUNT_KEY}
    volumes:
      - ./logs/prod:/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1200m
    memswap_limit: 1536m

  cockple-app-staging:
    container_name: cockple-app-staging
    image: kanghana1/cockple:staging
    restart: always
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m"
      SPRING_PROFILES_ACTIVE: staging
      LOG_PATH: /logs
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS_STAGING:-http://localhost:5173,https://cockple.site,https://www.cockple.site,https://staging.cockple.site,https://cockple-fe.vercel.app,https://cockple-fe.vercel.app/}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      FCM_FAKE_LATENCY_MS: ${FCM_FAKE_LATENCY_MS:-0}
      # 관측성(Observability) — OTLP 메트릭 push (staging 전용). 미설정 시 off.
      OTLP_METRICS_ENABLED: ${OTLP_METRICS_ENABLED:-false}
      OTEL_URL: ${OTEL_URL:-}
      OTEL_AUTH: ${OTEL_AUTH:-}
      OTLP_STEP: ${OTLP_STEP:-1m}
      # 스레드풀 튜닝(부하테스트용) 미설정 시 앱 기본값(chat 8/16/500, noti-ingress 2/4/500, noti-push 2/8/500)
      ASYNC_CHAT_CORE_SIZE: ${ASYNC_CHAT_CORE_SIZE:-8}
      ASYNC_CHAT_MAX_SIZE: ${ASYNC_CHAT_MAX_SIZE:-16}
      ASYNC_CHAT_QUEUE_CAPACITY: ${ASYNC_CHAT_QUEUE_CAPACITY:-500}
      # 알림 DB 저장(ingress) 풀
      ASYNC_NOTIFICATION_INGRESS_CORE_SIZE: ${ASYNC_NOTIFICATION_INGRESS_CORE_SIZE:-2}
      ASYNC_NOTIFICATION_INGRESS_MAX_SIZE: ${ASYNC_NOTIFICATION_INGRESS_MAX_SIZE:-4}
      ASYNC_NOTIFICATION_INGRESS_QUEUE_CAPACITY: ${ASYNC_NOTIFICATION_INGRESS_QUEUE_CAPACITY:-500}
      # FCM 발송(push) 풀
      ASYNC_NOTIFICATION_PUSH_CORE_SIZE: ${ASYNC_NOTIFICATION_PUSH_CORE_SIZE:-2}
      ASYNC_NOTIFICATION_PUSH_MAX_SIZE: ${ASYNC_NOTIFICATION_PUSH_MAX_SIZE:-8}
      ASYNC_NOTIFICATION_PUSH_QUEUE_CAPACITY: ${ASYNC_NOTIFICATION_PUSH_QUEUE_CAPACITY:-500}
      DB_PASSWORD: ${DB_PASSWORD}
      GCS_BUCKET: ${GCS_BUCKET}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI_STAGING}
      KAKAO_ADMIN_KEY: ${KAKAO_ADMIN_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      FIREBASE_SERVICE_ACCOUNT_KEY: ${FIREBASE_SERVICE_ACCOUNT_KEY}
    volumes:
      - ./logs/staging:/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1024m
    memswap_limit: 1280m

  nginx:
    image: nginx:stable-alpine
    container_name: cockple-nginx
    restart: always
    ports:
      - "80:80"
    environment:
      PROD_SERVER_NAME: ${NGINX_PROD_SERVER_NAME:-api.cockple.site}
      STAGING_SERVER_NAME: ${NGINX_STAGING_SERVER_NAME:-staging.cockple.site}
      NGINX_ENVSUBST_FILTER: SERVER_NAME
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
    mem_limit: 64m
    memswap_limit: 128m

volumes:
  mysql-data:
  redis-data:

networks:
  default:
    name: cockple_network
